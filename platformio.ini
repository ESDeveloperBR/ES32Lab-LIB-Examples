[platformio]
; Só pode ficar um default_envs ativo por vez, caso contrario o PlatformIO não compila corretamente.
;default_envs = camera_display_tft
;default_envs = tetris
;default_envs = es32lab_boxe
default_envs = photo_viewer

[release]
repository = ESDeveloperBR/ES32Lab-LIB-Examples
version = 1.4.0
version_date = 2026-10-29

[env]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+

; --- Camera Display TFT Example ---
[env:camera_display_tft]
build_src_filter = -<*> +<Camera-DisplayTFT/**>

[release_camera_display_tft]
name = Camera no Display TFT
developer = ES Developer
version = 1.0.0
version_date = 2026-10-27
description = Exemplo oficial da LIB ES32Lab que exibe imagens da camera OV2640 no display TFT. Codigo-fonte disponivel para download no botão Repositório.
keywords = ES32Lab, Camera, OV2640, Display, TFT, Exemplo
bin_name = camera_display_tft
repository = https://github.com/ESDeveloperBR/ES32Lab/blob/main/examples/Camera/Camera-DisplayTFT/Camera-DisplayTFT.ino
website = https://www.esdeveloper.com.br/
thumbnail_url = https://github.com/ESDeveloperBR/ES32Lab-LIB-Examples/releases/latest/download/camera_display_tft-thumb.jpg
manifest_url = https://github.com/ESDeveloperBR/ES32Lab-LIB-Examples/releases/latest/download/camera_display_tft-manifest.json
video_url =
uses_wifi = false

; --- Tetris Example ---
[env:tetris]
build_src_filter = -<*> +<Tetris/**>

[release_tetris]
name = Tetris ES32Lab
developer = ES Developer
version = 1.0.0
version_date = 2026-10-27
description = Exemplo oficial da LIB ES32Lab com jogo Tetris no display TFT, controlado pelo teclado analogico da placa. Codigo-fonte disponivel para download no botão Repositório.
keywords = ES32Lab, Tetris, Jogo, TFT, Teclado Analogico, Exemplo
bin_name = tetris
repository = https://github.com/ESDeveloperBR/ES32Lab/blob/main/examples/Games/Tetris/Tetris.ino
website = https://www.esdeveloper.com.br/
thumbnail_url = https://github.com/ESDeveloperBR/ES32Lab-LIB-Examples/releases/latest/download/tetris-thumb.jpg
manifest_url = https://github.com/ESDeveloperBR/ES32Lab-LIB-Examples/releases/latest/download/tetris-manifest.json
video_url =
uses_wifi = false

; --- ES32Lab Boxe Example ---
[env:es32lab_boxe]
build_src_filter = -<*> +<es32lab_boxe/**>

[release_es32lab_boxe]
name = ES32Lab Boxe
developer = ES Developer
version = 0.10.0
version_date = 2026-10-28
description = Exemplo oficial da LIB ES32Lab com jogo de boxe no display TFT, teclado analogico, efeitos sonoros e adversarios com inteligencia artificial. Codigo-fonte disponivel para download no botão Repositório.
keywords = ES32Lab, Boxe, Jogo, TFT, Teclado Analogico, Buzzer, Inteligencia Artificial, Exemplo
bin_name = es32lab_boxe
repository = https://github.com/ESDeveloperBR/ES32Lab/blob/main/examples/Games/ES32LabBoxe/ES32LabBoxe.ino
website = https://www.esdeveloper.com.br/
thumbnail_url = https://github.com/ESDeveloperBR/ES32Lab-LIB-Examples/releases/latest/download/es32lab_boxe-thumb.jpg
manifest_url = https://github.com/ESDeveloperBR/ES32Lab-LIB-Examples/releases/latest/download/es32lab_boxe-manifest.json
video_url =
uses_wifi = false

; --- Photo Viewer Example ---
[env:photo_viewer]
build_src_filter = -<*> +<photo_viewer/**>

[release_photo_viewer]
name = Visualizador de Fotos ES32Lab
developer = ES Developer
version = 1.0.0
version_date = 2026-10-29
description = Exemplo oficial da LIB ES32Lab que exibe fotos JPEG do cartao microSD no display TFT e permite navegar entre imagens pelo teclado analogico. Codigo-fonte disponivel para download no botao Repositorio.
keywords = ES32Lab, Visualizador de Fotos, JPEG, microSD, TFT, Teclado Analogico, Exemplo
bin_name = photo_viewer
repository = https://github.com/ESDeveloperBR/ES32Lab/blob/main/examples/Display-TFT/PhotoViewerAnalogKeyboard/PhotoViewerAnalogKeyboard.ino
website = https://www.esdeveloper.com.br/
thumbnail_url = https://github.com/ESDeveloperBR/ES32Lab-LIB-Examples/releases/latest/download/photo_viewer-thumb.jpg
manifest_url = https://github.com/ESDeveloperBR/ES32Lab-LIB-Examples/releases/latest/download/photo_viewer-manifest.json
video_url = https://www.youtube.com/shorts/wRR5wuhlXIY
uses_wifi = false