[platformio]
;default_envs = camera_display_tft
default_envs = tetris

[release]
repository = ESDeveloperBR/ES32Lab-LIB-Examples
version = 1.0.0

[env]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+

; --- Camera Display TFT Example ---
[env:camera_display_tft]
build_src_filter = -<*> +<Camera-DisplayTFT/**>

[release_camera_display_tft]
name = Camera no Display TFT
developer = ES Developer
version = 1.0.0
version_date = 2026-10-27
description = Exemplo oficial da LIB ES32Lab que exibe imagens da camera OV2640 no display TFT. Codigo-fonte disponivel para download.
keywords = ES32Lab, Camera, OV2640, Display, TFT, Exemplo
bin_name = camera_display_tft
repository = https://github.com/ESDeveloperBR/ES32Lab/blob/main/examples/Camera/Camera-DisplayTFT/Camera-DisplayTFT.ino
website = https://www.esdeveloper.com.br/
thumbnail_url = https://github.com/ESDeveloperBR/ES32Lab-LIB-Examples/releases/latest/download/es32lab_camera_display_tft_thumb.png
manifest_url = https://github.com/ESDeveloperBR/ES32Lab-LIB-Examples/releases/latest/download/es32lab_camera_display_tft_manifest.json
video_url =
uses_wifi = false

; --- Tetris Example ---
[env:tetris]
build_src_filter = -<*> +<Tetris/**>

[release_tetris]
name = Tetris ES32Lab
developer = ES Developer
version = 1.0.0
version_date = 2026-10-27
description = Exemplo oficial da LIB ES32Lab com jogo Tetris no display TFT, controlado pelo teclado analogico da placa. Codigo-fonte disponivel para download.
keywords = ES32Lab, Tetris, Jogo, TFT, Teclado Analogico, Exemplo
bin_name = es32lab_tetris
repository = https://github.com/ESDeveloperBR/ES32Lab/blob/main/examples/Games/Tetris/Tetris.ino
website = https://www.esdeveloper.com.br/
thumbnail_url = https://github.com/ESDeveloperBR/ES32Lab-LIB-Examples/releases/latest/download/es32lab_tetris_thumb.png
manifest_url = https://github.com/ESDeveloperBR/ES32Lab-LIB-Examples/releases/latest/download/es32lab_tetris_manifest.json
video_url =
uses_wifi = false
